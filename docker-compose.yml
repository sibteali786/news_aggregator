version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: feed_postgres
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    environment:
      POSTGRES_USER: feed_admin
      POSTGRES_PASSWORD: feed_pass
      POSTGRES_DB: feed_engine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feed_admin -d feed_engine"]
      interval: 5s
      timeout: 5s
      retries: 5
  api:
    build: .
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    container_name: feed_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://feed_admin:feed_pass@postgres:5432/feed_engine
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
  rss_poller:
    build:
      context: .
      dockerfile: Dockerfile.poller
    container_name: rss_poller
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://feed_admin:feed_pass@postgres:5432/feed_engine
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
